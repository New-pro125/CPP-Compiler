
<style>
.sidebar-btn { display:block; width:100%; text-align:left; background:none; border:none; padding:8px 14px; font-size:13px; font-family:var(--font-sans); color:var(--color-text-secondary); cursor:pointer; border-radius:var(--border-radius-md); transition:background .15s; }
.sidebar-btn:hover { background:var(--color-background-secondary); }
.sidebar-btn.active { background:var(--color-background-secondary); color:var(--color-text-primary); font-weight:500; }
.construct-chip { display:inline-block; font-family:var(--font-mono); font-size:11px; background:var(--color-background-secondary); border:0.5px solid var(--color-border-tertiary); border-radius:4px; padding:2px 7px; margin:2px; color:var(--color-text-secondary); }
.badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; padding:3px 9px; border-radius:var(--border-radius-md); margin-bottom:6px; }
.badge-ok { background:#EAF3DE; color:#27500A; }
.badge-error { background:#FCEBEB; color:#791F1F; }
.badge-missing { background:#FAEEDA; color:#633806; }
.badge-warning { background:#E6F1FB; color:#0C447C; }
.gap-card { border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:12px 14px; margin-bottom:10px; }
.gap-card-error { border-left:3px solid #E24B4A; }
.gap-card-missing { border-left:3px solid #EF9F27; }
.gap-card-warning { border-left:3px solid #378ADD; }
.gap-construct { font-family:var(--font-mono); font-size:12px; color:var(--color-text-secondary); margin-bottom:4px; }
.gap-issue { font-size:13px; font-weight:500; color:var(--color-text-primary); margin-bottom:6px; }
.gap-detail { font-size:12.5px; color:var(--color-text-secondary); line-height:1.6; margin-bottom:8px; }
.gap-fix { font-size:12px; color:#185FA5; background:#E6F1FB; border-radius:4px; padding:6px 10px; line-height:1.5; }
.section-label { font-size:11px; font-weight:500; color:var(--color-text-tertiary); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 8px; }
.ir-block { font-family:var(--font-mono); font-size:12px; background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:10px 14px; line-height:1.8; color:var(--color-text-secondary); }
.ir-line-comment { color:var(--color-text-tertiary); }
.counter-pill { font-size:11px; font-family:var(--font-mono); background:var(--color-background-secondary); border:0.5px solid var(--color-border-tertiary); border-radius:10px; padding:1px 8px; margin-left:6px; color:var(--color-text-tertiary); }
</style>

<h2 class="sr-only">Compiler validation assessment by grammar category</h2>

<div id="root" style="display:flex;min-height:560px;"></div>

<script>
const CATS = [
  {
    title:"Program Structure",
    constructs:["program","decl_list","decl"],
    stReqs:["Global scope (level 0) pre-opened in SymbolTable() constructor before any parse actions"],
    irReqs:["No quads emitted at structural level — all IR comes from matched sub-productions"],
    implemented:[
      "Global scope (level 0) initialized before parsing begins",
      "Correct dispatch to var_decl, func_decl, and stmt via decl rule"
    ],
    gaps:[
      {
        severity:"error",
        construct:"decl → stmt",
        issue:"Bare statements permitted at global scope",
        detail:"The grammar rule decl → stmt allows if (...){}, x = 5;, and loop constructs at file scope. C++ only permits declarations (variable declarations and function definitions) at global/namespace scope.",
        fix:"Remove stmt from decl alternatives, or in each stmt-initiating action check symTable->getCurrentScopeLevel() == 0 and emit a semantic error."
      }
    ]
  },
  {
    title:"Types & Declarations",
    constructs:["type_spec","var_decl","declarator_list","declarator","func_decl","param_list_opt","param_list","param_decl"],
    stReqs:[
      "type_spec: sets currDeclType / currDeclConst on parser context",
      "declarator: inserts symbol (name, dataType, isConst, isInitialized, irName mangling) into current scope",
      "func_decl: inserts function symbol (returnType, paramTypes, paramNames, defaultValues) into current scope, then opens new scope for body + parameters",
      "param_decl: pushes type/name/default to currParam/currParamNames/currParamDefaults vectors",
      "Scope for function body opened in beginFunctionDefinition(), closed in compound_stmt_func → leaveScopeWithUnusedWarnings()"
    ],
    irReqs:[
      "Initialized declarator: ASSIGN  rhs.place  -  irName",
      "func_decl: FUNC_BEGIN  funcName  -  -  …body…  FUNC_END  funcName  -  -",
      "No IR for uninitialized or const-only declarations"
    ],
    implemented:[
      "Redeclaration within same scope rejected",
      "Const variable must have initializer (checkConstInitialized)",
      "Type compatibility of initializer expression (validateAssignment + coerce)",
      "Narrowing conversion warning emitted via coerce()",
      "IR name mangling: shadowed variables renamed to name@0, name@1, … (renameEvents propagated)",
      "Function symbol records returnType, paramTypes, paramNames, defaultValues",
      "New scope opened / closed correctly around function body",
      "Parameters inserted into function scope with isInitialized = true"
    ],
    gaps:[
      {
        severity:"missing",
        construct:"type_spec → VOID used in var_decl",
        issue:"void variable declarations not rejected",
        detail:"VOID sets currDeclType = Type::VOID and then handleSimpleDeclarator or handleInitializedDeclarator inserts the symbol without any check. C++ forbids void x;.",
        fix:"In handleSimpleDeclarator and handleInitializedDeclarator, reject if ctx->currDeclType == Type::VOID."
      },
      {
        severity:"error",
        construct:"makeAssignExpr — LHS isUsed flag",
        issue:"Plain assignment incorrectly marks the LHS variable as 'used'",
        detail:"makeAssignExpr sets sym->isUsed = true after a simple assignment (x = expr). Per the stated assumption, 'used' means 'read'. A write-only variable should produce an unused-variable warning, but this flag prevents it.",
        fix:"Remove sym->isUsed = true from makeAssignExpr. Only set sym->isInitialized = true there. Reading is already tracked in makeIdentifierExpr and makeCompoundAssignExpr."
      },
      {
        severity:"missing",
        construct:"param_decl CONST modifier",
        issue:"const parameter flag lost during symbol insertion",
        detail:"addFunctionParam does not record whether a parameter is const. In beginFunctionDefinition all paramSym.isConst defaults to false, so const int x in a parameter list behaves as a mutable variable inside the function.",
        fix:"Add a currParamConst vector to ParserContext, push the const flag in addFunctionParam, and apply it when inserting each param symbol in beginFunctionDefinition."
      },
      {
        severity:"missing",
        construct:"param_decl with default value",
        issue:"Default parameter value is not type-checked against the declared parameter type",
        detail:"When parsing type_spec IDENTIFIER ASSIGN literal, addFunctionParam stores $4->place as the default string but never validates that $4->type is compatible with $1. e.g. int foo(float x = \"hi\") is accepted.",
        fix:"In the param_decl action, call semAnalyzer->validateAssignment(*$4, $1, yylineno) before calling addFunctionParam."
      },
      {
        severity:"missing",
        construct:"param_list ordering",
        issue:"Default parameters are not required to be trailing",
        detail:"C++ mandates that once a parameter has a default value all subsequent parameters must also have defaults (e.g., int foo(int x=1, int y) is illegal). No ordering check exists.",
        fix:"After collecting params in param_list, validate in beginFunctionDefinition: once a default is seen, all subsequent entries in currParamDefaults must also be non-empty."
      },
      {
        severity:"missing",
        construct:"param_decl → type_spec IDENTIFIER",
        issue:"void parameter type not rejected",
        detail:"int foo(void x) would insert a symbol with dataType VOID. C++ only allows void as an empty param list marker (int foo(void)), not as a named parameter type.",
        fix:"In addFunctionParam, reject if paramType == Type::VOID."
      }
    ]
  },
  {
    title:"Statements & Blocks",
    constructs:["stmt","stmt_list","block_item","expr_stmt","compound_stmt","compound_stmt_func"],
    stReqs:[
      "compound_stmt: addScope() on { and LeaveScope() + unused-variable warnings on }",
      "compound_stmt_func: does NOT call addScope() (relies on scope opened by beginFunctionDefinition)",
      "stmt_list / block_item: no direct ST operations"
    ],
    irReqs:[
      "expr_stmt: sub-expression IR already emitted during expr reduction; no additional quads",
      "Empty statement (;): no quads — correct",
      "Scopes have no IR markers in the flat quadruple representation"
    ],
    implemented:[
      "compound_stmt correctly calls addScope() / leaveScopeWithUnusedWarnings()",
      "compound_stmt_func correctly omits addScope() (function scope already open)",
      "Unused variable warnings reported at scope exit",
      "Error recovery in stmt via 'error SEMICOLON' production"
    ],
    gaps:[
      {
        severity:"warning",
        construct:"compound_stmt inside func_decl",
        issue:"Unused parameter warnings not emitted",
        detail:"leaveScopeWithUnusedWarnings() warns for variables with isUsed = false. However, because function parameters are inserted with isInitialized = true but isUsed = false, they should trigger unused-parameter warnings. In practice this may work, but it depends on whether the isUsed flag on param symbols is ever set during traversal of the function body.",
        fix:"Verify that parameter symbols go through makeIdentifierExpr (which sets *result->isUsed = true) when read inside the body. No code change needed if this is already the case; otherwise consider a separate unused-parameter pass."
      }
    ]
  },
  {
    title:"Control Flow",
    constructs:["if_stmt","while_stmt","do_while_stmt","for_stmt","switch_stmt","case_list","case_item","break_stmt","continue_stmt","return_stmt"],
    stReqs:[
      "if/while/do-while: no new scope (single stmt body reuses current scope)",
      "for_stmt: addScope() before for_init, LeaveScope() in endForLoop()",
      "switch_stmt: enterSwitchContext() → addScope() + beginSwitchCaseTracking(); leaveSwitchContext() on close"
    ],
    irReqs:[
      "if (no else):  JMP_FALSE cond falseL  |  <then>  |  LABEL falseL",
      "if (else):     JMP_FALSE cond falseL  |  <then>  |  JMP endL  |  LABEL falseL  |  <else>  |  LABEL endL",
      "while:         LABEL startL  |  JMP_FALSE cond endL  |  <body>  |  JMP startL  |  LABEL endL",
      "do-while:      LABEL startL  |  <body>  |  LABEL condL  |  JMP_TRUE cond startL  |  LABEL endL",
      "for:           <init>  LABEL condL  JMP_FALSE cond endL  JMP bodyL  LABEL updateL  <update>  JMP condL  LABEL bodyL  <body>  JMP updateL  LABEL endL",
      "switch:        JMP dispatchL  LABEL case_i …<body>…  JMP endL  LABEL dispatchL  EQ expr lit temp; JMP_TRUE temp caseL_i …  JMP defaultL|endL  LABEL endL",
      "break:         JMP breakLabels.back()",
      "continue:      JMP continueLabels.back()",
      "return:        RETURN val - -  or  RETURN - - -"
    ],
    implemented:[
      "Correct IR structure for all six control flow forms",
      "continue in for-loop correctly targets updateLabel (not condLabel)",
      "continue in do-while correctly targets condLabel",
      "break/continue depth tracking via loopDepth and switchDepth",
      "Deferred switch dispatch: cases emitted inline, dispatch table generated at end",
      "Duplicate case label detection within same switch",
      "Duplicate default detection",
      "for-init scope opened/closed correctly",
      "validateReturn: void/non-void mismatch, type coercion for numeric returns",
      "return outside function rejected"
    ],
    gaps:[
      {
        severity:"missing",
        construct:"if_stmt / while_stmt / do_while_stmt / for_stmt condition",
        issue:"Condition expression type is never validated",
        detail:"beginIfCondition, emitLoopConditionFalseJump, endDoWhileLoop, and emitForConditionAndUpdateLabel use conditionExpr->place directly in JMP_FALSE/JMP_TRUE without checking the type. Conditions of type STRING or VOID would silently produce invalid IR.",
        fix:"Before emitting the conditional jump, check that conditionExpr->type is not STRING, VOID, or UNKNOWN. Optionally coerce numeric types to BOOL."
      },
      {
        severity:"missing",
        construct:"switch_stmt — switch expression",
        issue:"Switch expression not validated as an integer type",
        detail:"C++ requires the controlling expression of a switch to be of integral or enumeration type. switch(3.14) or switch(\"x\") should be rejected but are accepted.",
        fix:"In beginSwitchStatement, check that switchExpr->type is INT, CHAR, or BOOL; emit a semantic error otherwise."
      },
      {
        severity:"missing",
        construct:"case_item — case literal",
        issue:"Case label type not validated against switch expression",
        detail:"Any literal (including FLOAT_LITERAL and STRING_LITERAL) is accepted as a case label. C++ only permits integral constant expressions. Additionally, there is no check that the case label type matches (or is compatible with) the switch expression type.",
        fix:"In beginCaseClause, verify literal->type is an integer-like type (INT, CHAR, BOOL) and is compatible with the switch expression type stored on switchExprStack."
      },
      {
        severity:"error",
        construct:"return_stmt — IR emitted unconditionally",
        issue:"RETURN quad emitted even when validateReturn() returns false",
        detail:"In both RETURN SEMICOLON and RETURN expr SEMICOLON productions, QG->emit(\"RETURN\"...) is called regardless of the bool returned by validateReturn. This pollutes the IR with unreachable or malformed return instructions when there is a semantic error.",
        fix:"Gate QG->emit(\"RETURN\"...) on the return value of validateReturn. Only emit if it returns true."
      }
    ]
  },
  {
    title:"Function Calls & Arguments",
    constructs:["arg_list_opt","arg_list"],
    stReqs:[
      "passedArgs cleared before arg_list_opt is entered",
      "Each argument expression resolved and pushed to passedArgs",
      "validateFunctionCall: symbol lookup, isFunction check, arg-count check, per-arg type coercion"
    ],
    irReqs:[
      "For each argument (in order):  PARAM  arg.place  -  -",
      "Non-void call:  CALL  funcName  argc  temp",
      "Void call:      CALL  funcName  argc  -"
    ],
    implemented:[
      "Too-few / too-many argument error with exact counts reported",
      "Per-argument type coercion for numeric-compatible parameters",
      "String ↔ non-string argument type mismatch rejected",
      "Function marked isUsed = true only when call is fully valid",
      "void return: CALL emitted with '-' destination (no spurious temp usage)",
      "Nested function calls work because passedArgs is saved/restored by the grammar structure"
    ],
    gaps:[
      {
        severity:"warning",
        construct:"arg_list — nested call passedArgs collision",
        issue:"Nested function calls within argument lists may corrupt passedArgs",
        detail:"If a function call appears as an argument to another call (foo(bar(x))), the inner call's arg_list_opt clears passedArgs and fills it with bar's arguments. When makeFunctionCallExpr runs for bar it consumes them correctly, but the outer foo's accumulated args up to that point are lost because passedArgs was re-cleared. This depends on exactly when arg_list_opt fires relative to the outer arg_list.",
        fix:"Replace the single flat passedArgs vector with a stack (std::vector<std::vector<ExprAttr>>). Push a new frame on entry to arg_list_opt, pop it in makeFunctionCallExpr. This is the standard approach for SDT with nested calls."
      }
    ]
  },
  {
    title:"Expressions",
    constructs:["expr","assign_expr","logical_or_expr","logical_and_expr","bitwise_or_expr","bitwise_xor_expr","bitwise_and_expr","equality_expr","relational_expr","shift_expr","additive_expr","multiplicative_expr","unary_expr","postfix_expr","primary_expr"],
    stReqs:[
      "All identifier reads go through resolveIdentifier → lookup → marks isUsed",
      "Assignments: checkAssignable → lookup → sets isInitialized / isUsed",
      "Compound assignments: resolveIdentifier (read) + checkAssignable (write)"
    ],
    irReqs:[
      "Binary ops:       OP  lhs.place  rhs.place  temp",
      "Coercion:         BTOI|CTOI|ITOF|FTOI|ITOC|ITOB  src  -  temp  (before binary op if needed)",
      "Simple assign:    ASSIGN  rhs.place  -  lhs.irName",
      "Compound assign:  OP lhs.place rhs.place temp  |  ASSIGN temp - lhs.irName",
      "Prefix ++/--:     INC/DEC  id.place  -  id.place",
      "Postfix ++/--:    ASSIGN id.place - temp  |  INC/DEC id.place - id.place",
      "Unary:            NOT|BNOT|UMINUS  operand.place  -  temp"
    ],
    implemented:[
      "All 11 compound assignment operators (+=, -=, *=, /=, %=, <<=, >>=, ^=, &=, |=)",
      "Type promotion in binary arithmetic (promoteType + coerce)",
      "Bitwise operators require integer types; auto-coerce BOOL/CHAR to INT",
      "Logical AND/OR: accepts any numeric-like type, returns BOOL",
      "Relational operators: promote both operands to common type, return BOOL",
      "String + String and String + Char concatenation allowed for PLUS/PLUSASSIGN",
      "checkAssignable: rejects const variables and function names as assignment targets",
      "resolveIdentifier: reports 'used before initialized' for uninitialized non-function symbols",
      "Postfix INC/DEC correctly saves old value to temp before mutation",
      "Parenthesized expressions propagate type and place correctly"
    ],
    gaps:[
      {
        severity:"error",
        construct:"unary_expr — NOT operator",
        issue:"NOT only accepts Type::BOOL; rejects valid C++ expressions like !x where x is int",
        detail:"checkUnaryOper for op==\"NOT\" returns UNKNOWN for everything except Type::BOOL. In C++, logical negation is valid on any scalar type — !0 == true, !(non-zero) == false.",
        fix:"In checkUnaryOper, for op==\"NOT\" accept any isNumericLike type. Coerce the operand to BOOL before emitting the NOT quad (emit ITOB/FTOI+ITOB as needed)."
      },
      {
        severity:"missing",
        construct:"unary_expr — UMINUS",
        issue:"Unary minus rejects CHAR operands",
        detail:"checkUnaryOper for \"UMINUS\" only passes Type::FLOAT and Type::INT. In C++, -'a' is valid (char undergoes integral promotion). This would fire a spurious semantic error.",
        fix:"Allow CHAR (and optionally BOOL) in the UMINUS branch; emit CTOI coercion to INT first, then UMINUS."
      },
      {
        severity:"missing",
        construct:"unary_expr — BITWISENOT",
        issue:"Bitwise NOT only accepts INT; rejects valid CHAR/BOOL operands",
        detail:"~c where c is char, or ~b where b is bool, is valid C++ (both promote to int). checkUnaryOper for \"BITWISENOT\" returns UNKNOWN for non-INT.",
        fix:"Extend the BITWISENOT branch to accept CHAR and BOOL, emitting CTOI/BTOI coercion to INT before the BNOT quad."
      },
      {
        severity:"warning",
        construct:"logical_or_expr / logical_and_expr",
        issue:"Short-circuit evaluation not implemented",
        detail:"C++ guarantees that in a && b the right operand is not evaluated if a is false (and symmetrically for ||). The current implementation always evaluates both operands, meaning side effects in the right operand always occur and potential null-dereference/division-by-zero in the right operand is not guarded.",
        fix:"Implement short-circuit IR: for AND emit JMP_FALSE on left to a 'false result' label before evaluating right; for OR emit JMP_TRUE on left to a 'true result' label."
      },
      {
        severity:"warning",
        construct:"equality_expr / relational_expr — string operands",
        issue:"GT, LT, GEQ, LEQ on strings emit IR that may be meaningless to the backend",
        detail:"When both operands are STRING, relational operators pass type checking (return BOOL) and emit LT/GT/GEQ/LEQ on string-valued places. Whether the backend can interpret this is unspecified.",
        fix:"Document backend string comparison semantics, or restrict relational operators on strings to EQ/NEQ only."
      }
    ]
  },
  {
    title:"Literals",
    constructs:["literal"],
    stReqs:["No symbol table operations — literals create anonymous ExprAttr values"],
    irReqs:[
      "Literal value is stored as the place string of the ExprAttr",
      "Used directly in subsequent quad operands (no ASSIGN emitted)"
    ],
    implemented:[
      "INT_LITERAL  → place = std::to_string(ival),    type = Type::INT",
      "FLOAT_LITERAL → place = std::to_string(dval),   type = Type::FLOAT",
      "CHAR_LITERAL  → place = \"'c'\",                  type = Type::CHAR",
      "BOOL_LITERAL  → place = \"true\"|\"false\",        type = Type::BOOL",
      "STRING_LITERAL → place = raw lexer string,      type = Type::STRING"
    ],
    gaps:[
      {
        severity:"warning",
        construct:"FLOAT_LITERAL",
        issue:"std::to_string truncates floats to 6 decimal places",
        detail:"std::to_string(float) formats with %.6f, losing precision. 3.141592653589793 becomes \"3.141593\". If the IR is later interpreted or compiled, float constants lose their full precision.",
        fix:"Use snprintf(buf, sizeof(buf), \"%.17g\", dval) or std::to_string on the double with a precision-preserving format to preserve round-trip accuracy."
      },
      {
        severity:"warning",
        construct:"CHAR_LITERAL",
        issue:"Escape sequences in char literals may not serialize correctly to IR",
        detail:"The place is built as \"'\" + std::string(1, cval) + \"'\". If the lexer delivers the char value as the actual byte (e.g., 0x0A for '\\n'), the IR will contain a raw newline inside single quotes, breaking any text-based IR reader.",
        fix:"Escape non-printable characters when serializing: if cval is non-printable, emit the escape sequence (e.g., '\\n', '\\t', '\\\\') rather than the raw byte."
      }
    ]
  }
];

const SEV_META = {
  error:   { label:"bug",    cls:"badge-error" },
  missing: { label:"missing",cls:"badge-missing" },
  warning: { label:"note",  cls:"badge-warning" }
};

function render(activeIdx) {
  const cat = CATS[activeIdx];
  const gapCount = cat.gaps.length;
  const errCount = cat.gaps.filter(g=>g.severity==="error").length;

  const sidebar = CATS.map((c,i) => {
    const gc = c.gaps.length;
    const ec = c.gaps.filter(g=>g.severity==="error").length;
    const active = i === activeIdx;
    return `<button class="sidebar-btn${active?' active':''}" onclick="setActive(${i})">
      <span>${c.title}</span>
      ${gc>0?`<span style="float:right;font-size:10px;font-family:var(--font-mono);color:${ec>0?'#A32D2D':'#BA7517'}">${ec>0?ec+'B':gc+'N'}</span>`:''}
    </button>`;
  }).join('');

  const constructs = cat.constructs.map(c=>`<span class="construct-chip">${c}</span>`).join('');

  const stBlock = cat.stReqs.map(r=>`<div style="font-size:12.5px;color:var(--color-text-secondary);line-height:1.7;padding:3px 0;border-bottom:0.5px solid var(--color-border-tertiary)">${r}</div>`).join('');

  const irBlock = cat.irReqs.map(r=>`<div style="font-size:12px;font-family:var(--font-mono);color:var(--color-text-secondary);line-height:1.8;">${r}</div>`).join('');

  const okList = cat.implemented.map(t=>`
    <div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
      <span style="font-size:13px;color:#639922;margin-top:1px;flex-shrink:0">&#10003;</span>
      <span style="font-size:12.5px;color:var(--color-text-secondary);line-height:1.6">${t}</span>
    </div>`).join('');

  const gapList = cat.gaps.map(g=>{
    const m = SEV_META[g.severity];
    return `<div class="gap-card gap-card-${g.severity}">
      <div class="gap-construct">${g.construct}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span class="badge ${m.cls}">${m.label}</span>
        <span class="gap-issue">${g.issue}</span>
      </div>
      <div class="gap-detail">${g.detail}</div>
      <div class="gap-fix">&#9654; Fix: ${g.fix}</div>
    </div>`;
  }).join('');

  const legend = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <span class="badge badge-error">bug — incorrect behavior</span>
    <span class="badge badge-missing">missing — required C++ semantic</span>
    <span class="badge badge-warning">note — limitation / edge case</span>
  </div>`;

  document.getElementById('root').innerHTML = `
    <div style="width:185px;flex-shrink:0;border-right:0.5px solid var(--color-border-tertiary);padding:12px 6px;display:flex;flex-direction:column;gap:2px">
      ${sidebar}
      <div style="margin-top:auto;padding-top:12px;border-top:0.5px solid var(--color-border-tertiary)">
        <div style="font-size:11px;color:var(--color-text-tertiary);padding:0 8px;line-height:1.6">B = bug &nbsp; N = note</div>
      </div>
    </div>
    <div style="flex:1;padding:16px 22px;overflow-y:auto;max-height:620px">
      <div style="margin-bottom:6px">
        <span style="font-size:16px;font-weight:500;color:var(--color-text-primary)">${cat.title}</span>
        <span class="counter-pill">${cat.implemented.length} &#10003;</span>
        ${gapCount>0?`<span class="counter-pill" style="border-color:${errCount>0?'#F09595':'#FAC775'};color:${errCount>0?'#A32D2D':'#BA7517'}">${gapCount} gaps</span>`:''}
      </div>
      <div style="margin-bottom:14px">${constructs}</div>

      <div class="section-label">Symbol table requirements</div>
      <div style="border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 14px">${stBlock}</div>

      <div class="section-label">IR emission requirements</div>
      <div class="ir-block">${irBlock}</div>

      <div class="section-label">Validations implemented (${cat.implemented.length})</div>
      <div style="border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:6px 14px">${okList}</div>

      <div class="section-label">Gaps & issues (${gapCount})</div>
      ${gapCount===0?`<div style="font-size:13px;color:var(--color-text-tertiary);padding:8px 0">No gaps identified for this category.</div>`:legend+gapList}
    </div>
  `;
}

window.setActive = function(i) { render(i); }
render(0);
</script>
